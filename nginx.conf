server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源长缓存（Vite 构建产物带 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
